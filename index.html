<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daylight | 계획 & 맞춤 집중 타이머 with 치즈냥이</title>
  <!-- Pretendard 폰트 (별도 설치 없이 웹에서 로드) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
</head>
<body>
  <div class="app-wrapper">
    <!-- 메인 컨테이너 -->
    <main class="daylight-card">
      
      <!-- 상단 헤더: 로고 및 오늘 날짜 -->
      <header class="app-header">
        <div class="brand">
          <div class="logo-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">Daylight</h1>
            <p class="brand-subtitle">오늘 하루도 빛나는 순간으로</p>
          </div>
        </div>

        <div class="date-badge">
          <span class="calendar-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <span id="current-date">날짜 불러오는 중...</span>
        </div>
      </header>

      <!-- 달성률 진행 카드 -->
      <section class="progress-section" aria-label="할 일 달성률">
        <div class="progress-header">
          <div class="progress-info">
            <span class="progress-label">오늘의 달성률</span>
            <span id="encouragement-text" class="encouragement">시작이 반이에요! 차근차근 해내봐요 ✨</span>
          </div>
          <span id="progress-percentage" class="progress-rate">0%</span>
        </div>

        <!-- 진행 바 -->
        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <!-- 카운트 통계 -->
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-number" id="total-count">0</span>
            <span class="stat-desc">전체 할 일</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-number completed-num" id="completed-count">0</span>
            <span class="stat-desc">완료됨</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-number remaining-num" id="remaining-count">0</span>
            <span class="stat-desc">남은 일</span>
          </div>
        </div>
      </section>

      <!-- ⏱️ 최대 24시간 맞춤 설정 집중 타이머 카드 -->
      <section class="timer-section" aria-label="맞춤 집중 타이머">
        <div class="timer-card">
          <!-- 타이머 헤더: 모드 전환 탭 -->
          <div class="timer-header">
            <div class="timer-title-box">
              <span class="timer-badge">포커스 타임</span>
              <span id="timer-status-text" class="timer-status">목표 시간을 정해보세요 🎯</span>
            </div>
            
            <div class="timer-tabs" role="tablist">
              <button type="button" id="tab-custom" class="timer-tab active" role="tab" aria-selected="true">
                목표 타이머
              </button>
              <button type="button" id="tab-stopwatch" class="timer-tab" role="tab" aria-selected="false">
                자유 스톱워치
              </button>
            </div>
          </div>

          <!-- 24시간 맞춤 시간 설정 컨트롤 (목표 타이머 모드일 때만 표시) -->
          <div id="custom-time-setter" class="time-setter-box">
            <div class="time-inputs-row">
              <div class="input-time-group">
                <input type="number" id="input-hours" min="0" max="24" value="1" class="time-num-input" />
                <span class="time-unit">시간</span>
              </div>
              <span class="time-colon">:</span>
              <div class="input-time-group">
                <input type="number" id="input-minutes" min="0" max="59" value="0" class="time-num-input" />
                <span class="time-unit">분</span>
              </div>
              <button type="button" id="apply-time-btn" class="time-apply-btn">시간 설정</button>
            </div>
            <!-- 간편 퀵 프리셋 버튼들 -->
            <div class="quick-presets">
              <button type="button" class="preset-pill" data-hours="0" data-mins="25">25분</button>
              <button type="button" class="preset-pill" data-hours="1" data-mins="0">1시간</button>
              <button type="button" class="preset-pill" data-hours="2" data-mins="0">2시간</button>
              <button type="button" class="preset-pill" data-hours="4" data-mins="0">4시간</button>
            </div>
          </div>

          <!-- 타이머 대형 시계 표시 (HH:MM:SS) -->
          <div class="timer-display-box">
            <div id="timer-display" class="timer-display">01:00:00</div>
          </div>

          <!-- 타이머 조작 버튼 그룹 -->
          <div class="timer-controls">
            <button type="button" id="timer-toggle-btn" class="timer-btn primary-btn" aria-label="타이머 시작">
              <svg id="timer-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <svg id="timer-pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
              <span id="timer-toggle-text">집중 시작</span>
            </button>

            <button type="button" id="timer-reset-btn" class="timer-btn secondary-btn" aria-label="타이머 초기화">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              <span>초기화</span>
            </button>
          </div>

          <!-- 오늘 총 집중 공부 시간 기록 배너 -->
          <div class="total-focus-bar">
            <div class="total-focus-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>오늘 총 집중 시간</span>
            </div>
            <span id="total-focus-time" class="total-focus-value">0초</span>
          </div>
        </div>
      </section>

      <!-- 할 일 입력 섹션 -->
      <section class="input-section">
        <form id="todo-form" class="todo-form" novalidate>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="todo-input" 
              class="todo-input" 
              placeholder="오늘 꼭 해야 할 일을 적어보세요..." 
              autocomplete="off"
              maxlength="100"
            />
            <button type="submit" id="add-btn" class="add-button" aria-label="할 일 추가">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>추가</span>
            </button>
          </div>
          <!-- 유효성 검사 에러 메시지 영역 -->
          <p id="input-error" class="input-error-msg" aria-live="polite"></p>
        </form>
      </section>

      <!-- 할 일 목록 섹션 -->
      <section class="todo-list-section">
        <div class="list-header">
          <h2 class="list-title">할 일 목록</h2>
          <span id="list-badge" class="list-badge">0개</span>
        </div>

        <!-- 실제 할 일 리스트 -->
        <ul id="todo-list" class="todo-list">
          <!-- 자바스크립트로 동적 렌더링됩니다 -->
        </ul>

        <!-- 빈 상태 (할 일이 없을 때 표시) -->
        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-icon-box">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="9" y1="15" x2="15" y2="15"></line>
              <line x1="9" y1="11" x2="15" y2="11"></line>
            </svg>
          </div>
          <p class="empty-title">등록된 할 일이 없어요</p>
          <p class="empty-subtitle">위 입력창에 새로운 계획을 추가하고 기분 좋게 시작해볼까요?</p>
        </div>
      </section>

      <!-- 하단 정보 -->
      <footer class="app-footer">
        <p>Daylight · 하루의 걸음을 기록하는 나만의 플래너 & 치즈냥이 🐱</p>
      </footer>
    </main>
  </div>

  <!-- 💩 치즈냥이가 눈 똥들이 배치될 전역 컨테이너 -->
  <div id="poop-layer" class="poop-layer" aria-label="고양이 배변 영역"></div>

  <!-- 🐱 화면을 자유롭게 돌아다니며, 마우스로 들어올릴 수 있는 치즈냥이 -->
  <aside id="cheese-cat-container" class="cat-companion" aria-label="귀여운 치즈냥이 친구 (드래그하여 이동 가능)">
    <!-- 고양이 말풍선 -->
    <div id="cat-speech" class="cat-speech-bubble" style="display: none;">
      <span id="cat-speech-text">안냥! 오늘도 화이팅이다냥 🐾</span>
    </div>
    
    <!-- 순수 SVG 치즈냥이 캐릭터 -->
    <div id="cat-body" class="cat-character state-walking">
      <svg class="cat-svg" viewBox="0 0 120 90" width="105" height="78">
        <!-- 바닥 그림자 -->
        <ellipse class="cat-shadow" cx="60" cy="82" rx="42" ry="6" fill="rgba(45, 39, 56, 0.15)" />

        <!-- 꼬리 -->
        <g class="cat-tail-group">
          <path class="cat-tail" d="M22 60 C10 50, 4 32, 14 22 C18 18, 26 22, 22 30 C18 38, 20 52, 28 62" 
                fill="#F6993F" stroke="#E07920" stroke-width="2.5" stroke-linecap="round" />
          <!-- 꼬리 줄무늬 -->
          <path d="M16 28 Q18 30 19 33" stroke="#D36B15" stroke-width="2.5" stroke-linecap="round" />
          <path d="M18 38 Q20 41 22 43" stroke="#D36B15" stroke-width="2.5" stroke-linecap="round" />
        </g>

        <!-- 몸통 (통통한 치즈색) -->
        <ellipse class="cat-torso" cx="58" cy="58" rx="38" ry="24" fill="#FBA748" stroke="#E08620" stroke-width="2.5" />

        <!-- 몸통 치즈 줄무늬 -->
        <path class="cat-stripe s1" d="M48 38 Q50 48 48 54" stroke="#E07920" stroke-width="3" stroke-linecap="round" fill="none" />
        <path class="cat-stripe s2" d="M60 36 Q62 48 60 55" stroke="#E07920" stroke-width="3" stroke-linecap="round" fill="none" />
        <path class="cat-stripe s3" d="M72 38 Q73 48 71 54" stroke="#E07920" stroke-width="3" stroke-linecap="round" fill="none" />

        <!-- 하얀 뱃살 -->
        <ellipse class="cat-belly" cx="58" cy="65" rx="22" ry="12" fill="#FFF8EE" />

        <!-- 뒷발 -->
        <g class="cat-back-feet">
          <ellipse class="cat-back-foot foot-1" cx="34" cy="74" rx="10" ry="7" fill="#FBA748" stroke="#E08620" stroke-width="2" />
          <ellipse class="cat-back-foot foot-1-inner" cx="33" cy="75" rx="6" ry="4" fill="#FFF8EE" />
          <ellipse class="cat-back-foot foot-2" cx="46" cy="76" rx="9" ry="6" fill="#FBA748" stroke="#E08620" stroke-width="1.8" />
        </g>

        <!-- 앞발 (왼발 / 오른발 - 꾹꾹이 및 축 늘어짐용) -->
        <g class="cat-paws">
          <ellipse id="cat-paw-left" class="cat-paw left" cx="72" cy="75" rx="8" ry="6" fill="#FFF8EE" stroke="#E08620" stroke-width="1.8" />
          <ellipse id="cat-paw-right" class="cat-paw right" cx="86" cy="75" rx="8" ry="6" fill="#FFF8EE" stroke="#E08620" stroke-width="1.8" />
        </g>

        <!-- 머리 그룹 -->
        <g class="cat-head-group">
          <circle class="cat-head" cx="86" cy="42" r="21" fill="#FBA748" stroke="#E08620" stroke-width="2.5" />

          <!-- 왼쪽 귀 -->
          <polygon points="73,28 80,11 90,24" fill="#FBA748" stroke="#E08620" stroke-width="2" stroke-linejoin="round" />
          <polygon points="76,26 81,15 88,24" fill="#FFB7B2" />

          <!-- 오른쪽 귀 -->
          <polygon points="87,24 99,12 103,28" fill="#FBA748" stroke="#E08620" stroke-width="2" stroke-linejoin="round" />
          <polygon points="89,24 98,16 100,27" fill="#FFB7B2" />

          <!-- 이마 줄무늬 -->
          <path d="M83 23 L85 29" stroke="#E07920" stroke-width="2.5" stroke-linecap="round" />
          <path d="M89 22 L89 29" stroke="#E07920" stroke-width="2.5" stroke-linecap="round" />
          <path d="M94 23 L92 29" stroke="#E07920" stroke-width="2.5" stroke-linecap="round" />

          <!-- 1) 평소 눈 (똘망똘망한 눈) -->
          <g class="cat-eyes-open">
            <ellipse cx="80" cy="38" rx="4" ry="5.5" fill="#2E241E" />
            <circle cx="78.5" cy="36.5" r="1.6" fill="#FFFFFF" />
            <ellipse cx="94" cy="38" rx="4" ry="5.5" fill="#2E241E" />
            <circle cx="92.5" cy="36.5" r="1.6" fill="#FFFFFF" />
          </g>

          <!-- 2) 잠잘 때 감은 눈 -->
          <g class="cat-eyes-closed" style="display: none;">
            <path d="M76 40 Q80 44 84 40" stroke="#2E241E" stroke-width="2" stroke-linecap="round" fill="none" />
            <path d="M90 40 Q94 44 98 40" stroke="#2E241E" stroke-width="2" stroke-linecap="round" fill="none" />
          </g>

          <!-- 3) 들렸을 때 목덜미 잡힌 땡그란 깜짝 눈 (o.o) -->
          <g class="cat-eyes-surprised" style="display: none;">
            <circle cx="80" cy="38" r="5" fill="#2E241E" />
            <circle cx="79" cy="36" r="2" fill="#FFFFFF" />
            <circle cx="94" cy="38" r="5" fill="#2E241E" />
            <circle cx="93" cy="36" r="2" fill="#FFFFFF" />
          </g>

          <!-- 4) 똥 쌀 때 힘주는 끙차 눈 (>.<) -->
          <g class="cat-eyes-pooping" style="display: none;">
            <path d="M76 35 L84 40 L76 43" stroke="#2E241E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <path d="M98 35 L90 40 L98 43" stroke="#2E241E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </g>

          <!-- 하얀 주둥이 영역 -->
          <ellipse cx="86" cy="47" rx="10" ry="7" fill="#FFF8EE" />

          <!-- 핑크 코 & 입술 -->
          <polygon points="84,43 88,43 86,46" fill="#FF8A80" />
          <path d="M83 48 Q86 50 86 46 Q86 50 89 48" stroke="#2E241E" stroke-width="1.6" stroke-linecap="round" fill="none" />

          <!-- 분홍 볼터치 -->
          <ellipse cx="73" cy="45" rx="3.5" ry="2.2" fill="rgba(255, 138, 128, 0.55)" />
          <ellipse cx="99" cy="45" rx="3.5" ry="2.2" fill="rgba(255, 138, 128, 0.55)" />

          <!-- 수염 -->
          <path d="M72 45 L62 43 M72 47 L61 48" stroke="#8D6E63" stroke-width="1.3" stroke-linecap="round" />
          <path d="M100 45 L110 43 M100 47 L111 48" stroke="#8D6E63" stroke-width="1.3" stroke-linecap="round" />
        </g>
      </svg>
    </div>
  </aside>

  <!-- 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
